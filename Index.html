<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصمم السيرة الذاتية الاحترافي | Pro CV Builder</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Arabic (Cairo, Tajawal, IBM Plex Sans Arabic) & English (Inter, Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        tajawal: ['Tajawal', 'sans-serif'],
                        ibm: ['IBM Plex Sans Arabic', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        roboto: ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Base UI Styles */
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* A4 Page Dimensions & Scaling */
        .a4-container {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Responsive Preview Scaling on smaller viewports */
        @media screen and (max-width: 1280px) {
            .preview-scale-wrapper {
                transform: scale(0.82);
                transform-origin: top center;
                margin-bottom: -50mm;
            }
        }
        @media screen and (max-width: 1024px) {
            .preview-scale-wrapper {
                transform: scale(0.85);
                transform-origin: top center;
                margin-bottom: -40mm;
            }
        }
        @media screen and (max-width: 768px) {
            .preview-scale-wrapper {
                transform: scale(0.46);
                transform-origin: top center;
                margin-bottom: -155mm;
            }
        }
        @media screen and (max-width: 420px) {
            .preview-scale-wrapper {
                transform: scale(0.39);
                transform-origin: top center;
                margin-bottom: -178mm;
            }
        }

        /* Print Media Query - Exact A4 Output without UI Chrome */
        @media print {
            @page {
                size: A4;
                margin: 0;
            }
            html, body {
                width: 210mm;
                height: 297mm;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print {
                display: none !important;
            }
            #preview-pane {
                display: block !important;
                width: 100% !important;
                height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
                background: white !important;
                position: static !important;
            }
            .preview-scale-wrapper {
                transform: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .a4-container {
                width: 210mm !important;
                min-height: 297mm !important;
                box-shadow: none !important;
                margin: 0 !important;
                border-radius: 0 !important;
            }
        }

        /* Dynamic Accent Variables */
        :root {
            --cv-accent: #1e40af;
            --cv-accent-light: #eff6ff;
            --cv-accent-border: #bfdbfe;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Toast Notification Container (Replaces alert) -->
    <div id="toast-container" class="no-print fixed bottom-5 left-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Custom Confirmation Modal (Replaces confirm) -->
    <div id="confirm-modal" class="no-print hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-200 transform transition-all">
            <div class="flex items-center gap-3 text-amber-600 mb-3">
                <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-triangle-exclamation text-lg"></i>
                </div>
                <h3 id="confirm-title" class="text-lg font-bold text-slate-800">تأكيد الإجراء</h3>
            </div>
            <p id="confirm-message" class="text-slate-600 text-sm leading-relaxed mb-6">هل أنت متأكد من رغبتك في المتابعة؟</p>
            <div class="flex items-center justify-end gap-3">
                <button id="confirm-cancel-btn" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">إلغاء</button>
                <button id="confirm-ok-btn" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 transition">نعم، متابعة</button>
            </div>
        </div>
    </div>

    <!-- Top Navigation / Action Toolbar -->
    <header class="no-print bg-white border-b border-slate-200 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shrink-0 z-30 shadow-sm">
        <!-- Brand Logo -->
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-blue-700 text-white flex items-center justify-center shadow-sm">
                <i class="fa-solid fa-file-signature text-lg"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold text-slate-800 leading-tight" data-ui="appTitle">مصمم السيرة الذاتية</h1>
                <p class="text-[11px] text-slate-500 hidden sm:block" data-ui="appSubtitle">أنشئ سيرتك الذاتية باحترافية وصدّرها بصيغة PDF</p>
            </div>
        </div>

        <!-- Mobile View Switcher (Editor vs Preview) -->
        <div class="flex lg:hidden bg-slate-100 p-1 rounded-xl border border-slate-200">
            <button onclick="setMobileView('editor')" id="mob-btn-editor" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-blue-700 shadow-sm transition">
                <i class="fa-solid fa-pen-to-square ml-1"></i> <span data-ui="editTab">التحرير</span>
            </button>
            <button onclick="setMobileView('preview')" id="mob-btn-preview" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 transition">
                <i class="fa-solid fa-eye ml-1"></i> <span data-ui="previewTab">المعاينة</span>
            </button>
        </div>

        <!-- Global Controls -->
        <div class="flex items-center gap-2 flex-wrap">
            <!-- CV Language Toggle (AR / EN) -->
            <div class="flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200" title="لغة السيرة الذاتية / CV Language">
                <button onclick="setCVLanguage('ar')" id="lang-btn-ar" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-blue-700 text-white transition">عربي</button>
                <button onclick="setCVLanguage('en')" id="lang-btn-en" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition">English</button>
            </div>

            <!-- Sample & Clear Actions -->
            <button onclick="handleLoadSample()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition flex items-center gap-1.5">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span class="hidden md:inline" data-ui="loadSample">نموذج تجريبي</span>
            </button>

            <button onclick="handleClearAll()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100 transition flex items-center gap-1.5">
                <i class="fa-solid fa-trash-can"></i>
                <span class="hidden md:inline" data-ui="clearAll">مسح الكل</span>
            </button>

            <!-- JSON Backup Dropdown / Buttons -->
            <div class="relative inline-block">
                <button onclick="toggleBackupMenu()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200 transition flex items-center gap-1.5">

                    <span class="hidden sm:inline" data-ui="backup">نسخ احتياطي</span>
                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>
                <div id="backup-menu" class="hidden absolute left-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-200 py-1.5 z-40">
                    <button onclick="exportJSON()" class="w-full text-right px-4 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                        <i class="fa-solid fa-download text-blue-600"></i> <span data-ui="exportJson">حفظ البيانات (JSON)</span>
                    </button>
                    <label class="w-full text-right px-4 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-upload text-emerald-600"></i> <span data-ui="importJson">استعادة بيانات (JSON)</span>
                        <input type="file" id="json-file-input" accept=".json" class="hidden" onchange="importJSON(event)">
                    </label>
                </div>
            </div>

            <!-- Print / Export PDF Button -->
            <button onclick="printCV()" class="px-4 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-blue-700 text-white hover:bg-blue-800 shadow-sm hover:shadow transition flex items-center gap-2">
                <i class="fa-solid fa-file-pdf"></i>
                <span data-ui="exportPdf">تصدير PDF / طباعة</span>
            </button>
        </div>
    </header>

    <!-- Main Split-Screen Workspace -->

                    <!-- Template Selector -->
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 mb-1" data-ui="templateLabel">القالب التصميمي</label>
                        <select id="template-select" onchange="updateDesign('template', this.value)" class="w-full text-xs font-semibold bg-white border border-slate-300 rounded-xl px-2.5 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">

                            <option value="classic">كلاسيكي (Classic)</option>
                            <option value="executive">تنفيذي (Executive)</option>

                    </div>

                            <option value="tajawal">Tajawal (تجول)</option>

                            <button onclick="updateDesign('color', '#0f766e')" class="w-6 h-6 rounded-full bg-[#0f766e] ring-2 ring-offset-1 ring-transparent focus:ring-slate-400 transition transform hover:scale-110" title="أخضر زمردي"></button>
                            <button onclick="updateDesign('color', '#334155')" class="w-6 h-6 rounded-full bg-[#334155] ring-2 ring-offset-1 ring-transparent focus:ring-slate-400 transition transform hover:scale-110" title="رمادي داكن"></button>
                            <button onclick="updateDesign('color', '#7c2d12')" class="w-6 h-6 rounded-full bg-[#7c2d12] ring-2 ring-offset-1 ring-transparent focus:ring-slate-400 transition transform hover:scale-110" title="بني كلاسيكي"></button>

                        </div>
                    </div>
                </div>
            </div>

            <div class="flex overflow-x-auto bg-white border-b border-slate-200 px-2 pt-2 gap-1 shrink-0 no-scrollbar" id="editor-tabs">

                </button>
                <button onclick="switchTab('skills')" data-tab="skills" class="tab-btn px-3 py-2 rounded-t-xl text-xs font-bold whitespace-nowrap border-b-2 border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition flex items-center gap-1.5">

                    <i class="fa-solid fa-award"></i> <span data-ui="tabExtras">اللغات والشهادات</span>
                </button>
            </div>

            <!-- Form Content Container -->
            <div id="form-container" class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-5">
                <!-- Dynamically injected form fields based on active tab -->
            </div>
        </section>

        <!-- RIGHT/END PANE: Live A4 Resume Preview -->
        <section id="preview-pane" class="hidden lg:flex flex-1 bg-slate-200/80 overflow-y-auto p-4 sm:p-8 justify-center items-start">
            <div class="preview-scale-wrapper">
                <div id="cv-document" class="a4-container" dir="rtl">
                    <!-- Live Rendered CV Template goes here -->
                </div>
            </div>
        </section>

        // ==========================================

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-slate-800' : type === 'error' ? 'bg-rose-600' : 'bg-blue-700';
            const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : type === 'error' ? 'fa-circle-xmark text-white' : 'fa-circle-info text-blue-200';
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-semibold flex items-center gap-2.5 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            modal.classList.remove('hidden');

            const okBtn = document.getElementById('confirm-ok-btn');
            const cancelBtn = document.getElementById('confirm-cancel-btn');

            const cleanup = () => {
                modal.classList.add('hidden');
                okBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            okBtn.onclick = () => {
                cleanup();
                onConfirm();
            };
            cancelBtn.onclick = cleanup;
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.classList.add('active', 'border-blue-700', 'text-blue-700', 'bg-blue-50/50');
                    btn.classList.remove('border-transparent', 'text-slate-600');
                } else {
                    btn.classList.remove('active', 'border-blue-700', 'text-blue-700', 'bg-blue-50/50');
                    btn.classList.add('border-transparent', 'text-slate-600');
                }
            });
            renderForm();
        }

        function setMobileView(view) {
            const editor = document.getElementById('editor-pane');
            const preview = document.getElementById('preview-pane');
            const btnEd = document.getElementById('mob-btn-editor');
            const btnPr = document.getElementById('mob-btn-preview');

            if (view === 'editor') {
                editor.classList.remove('hidden');
                editor.classList.add('flex');
                preview.classList.add('hidden');
                preview.classList.remove('flex');
                
                btnEd.classList.add('bg-white', 'text-blue-700', 'shadow-sm');
                btnEd.classList.remove('text-slate-600');
                btnPr.classList.remove('bg-white', 'text-blue-700', 'shadow-sm');
                btnPr.classList.add('text-slate-600');
            } else {
                editor.classList.add('hidden');
                editor.classList.remove('flex');
                preview.classList.remove('hidden');
                preview.classList.add('flex');

                btnPr.classList.add('bg-white', 'text-blue-700', 'shadow-sm');
                btnPr.classList.remove('text-slate-600');
                btnEd.classList.remove('bg-white', 'text-blue-700', 'shadow-sm');
                btnEd.classList.add('text-slate-600');
            }
        }

        function exportJSON() {
            document.getElementById('backup-menu').classList.add('hidden');
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cvData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            const fileName = (cvData.personal.fullName || 'resume').trim().replace(/\s+/g, '_') + '_CV.json';
            downloadAnchor.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchor);

        }

        function importJSON(event) {
            document.getElementById('backup-menu').classList.add('hidden');
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.personal) {
                        cvData = imported;
                        syncDesignControls();
                        updateLanguageUI();
                        renderForm();
                        renderCV();
                        saveState();
                        showToast(cvData.lang === 'ar' ? 'تم استعادة البيانات بنجاح' : 'Resume data restored successfully');
                    } else {
                        throw new Error('Invalid format');
                    }
                } catch (err) {
                    showToast(cvData.lang === 'ar' ? 'ملف غير صالح!' : 'Invalid JSON file!', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // 5. FORM RENDERING & DATA MUTATIONS
        // ==========================================

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function updatePersonal(field, value) {
            cvData.personal[field] = value;
            renderCV();
            saveState();

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) {
                showToast(cvData.lang === 'ar' ? 'حجم الصورة يجب أن يكون أقل من 2 ميجابايت' : 'Image size must be under 2MB', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                cvData.personal.photo = e.target.result;
                renderForm();
                renderCV();
                saveState();
            };
            reader.readAsDataURL(file);
        }

            cvData.personal.photo = '';

        // Generic Array Item Handlers (Experience, Education, Skills, Projects, Languages, Certifications)
        function addItem(section) {
            const id = section + '-' + Date.now();
            const isAr = cvData.lang === 'ar';
            const templates = {
                experience: { id, position: '', company: '', location: '', startDate: '', endDate: '', current: false, description: '' },
                education: { id, degree: '', institution: '', location: '', startDate: '', endDate: '', grade: '' },
                skills: { id, name: '', level: 85 },
                projects: { id, name: '', role: '', link: '', description: '' },
                languages: { id, name: '', proficiency: isAr ? 'جيد جداً' : 'Professional' },
                certifications: { id, name: '', issuer: '', year: '' }
            };
            cvData[section].push(templates[section]);
            renderForm();
            renderCV();
            saveState();
        }

        function updateItem(section, index, field, value) {
            cvData[section][index][field] = value;
            renderCV();
            saveState();
        }

        function deleteItem(section, index) {
            cvData[section].splice(index, 1);
            renderForm();
            renderCV();
            saveState();
        }

        function moveItem(section, index, direction) {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= cvData[section].length) return;
            const temp = cvData[section][index];
            cvData[section][index] = cvData[section][targetIndex];
            cvData[section][targetIndex] = temp;
            renderForm();
            renderCV();
            saveState();
        }
